name: Francesco Longo
role: Lab Director &middot; Associate Professor
photo: /images/people/Longo-director.jpg
bio: >-
  Francesco Longo is Associate Professor at the Department of Engineering of the
  University of Messina, where he leads the STRATUS Lab. His work spans distributed
  systems, cloud and edge computing, and the security of industrial and automotive
  infrastructure, with more than 170 publications in the field. He is a founding
  partner of <a href="https://smartme.io/" target="_blank" rel="noopener">SmartMe.IO</a>,
  an academic spin-off building IoT and resilience engineering platforms.
