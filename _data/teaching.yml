# Corsi tenuti da membri del gruppo. I dati vengono dal curriculum, aggiornato ad
# aprile 2024, integrato per i corsi avviati dopo quella data.
# `status: current` per i corsi ancora attivi, `past` per quelli conclusi.
#
# CONVENZIONE. `role` distingue chi tiene l'intero corso da chi ne tiene un modulo:
# "Course leader" per la titolarità, "Module lecturer" quando l'insegnamento è una
# parte di un corso integrato. Il dato va indicato sempre, perché un modulo da 2 CFU
# dentro un corso altrui non è la stessa cosa di un corso da 12 CFU.
#
# Il docente non sta nelle singole voci: essendo lo stesso per tutti i corsi, la
# pagina lo dichiara una volta in apertura. Se un giorno insegnerà anche qualcun
# altro del gruppo, andrà reintrodotto un campo `teacher` per voce.
#
# `credits` e `hours` sono CFU e ore di didattica frontale. `since` è il primo anno
# accademico di titolarità: dice da quanto il corso è tenuto, che è informazione
# diversa dall'anno corrente.

