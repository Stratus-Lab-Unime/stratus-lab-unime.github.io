# Progetti in cui Francesco Longo ha un ruolo formale di responsabilità.
# `status: current` li mette fra quelli attivi, `past` fra i conclusi.
# L'ordine qui è quello mostrato in pagina, dal più recente.
#
# CONVENZIONE. Ogni voce è resa su quattro righe:
#   1. acronym + role      l'acronimo come titolo, con il ruolo in etichetta
#   2. title               il titolo per esteso
#   3. scope + project     dove si collòca la voce nella gerarchia
#   4. programme/period/funding, poi i partner
#
# `scope` usa un vocabolario controllato, perché le voci non stanno tutte allo
# stesso livello: "Research line N", "Activity N", "Work packages N". Serve solo
# quando individua una parte identificabile e numerata del progetto. Si lascia
# vuoto sia quando la voce è il progetto intero, sia quando il ruolo riguarda
# l'unità locale: in quel caso lo dice già il ruolo, con "for the University of
# Messina", che è più chiaro di un'etichetta come "local unit".
#
# Quando più voci condividono lo stesso acronimo, `acronym` porta fra parentesi il
# triennio del Piano che le distingue, mentre `period` resta il periodo di effettivo
# coinvolgimento del gruppo: i due non coincidono, perché si entra a Piano avviato.
# Il triennio è ripetuto anche in `programme`, accanto alla dicitura che lo spiega.
#
# `role` deve restare comprensibile da solo, anche a costo di sovrapporsi in parte
# a `scope`: è la prima cosa che si legge, e "Scientific coordinator" senza altro
# si intende come coordinamento dell'intero progetto. Il ruolo dice che tipo di
# responsabilità era, lo scope su quale parte.
#
# `funding` deve dire a cosa si riferisce la cifra quando la voce non è il progetto
# intero: "for the activity", "for the research line". Altrimenti il lettore
# potrebbe prenderla per il finanziamento complessivo del progetto. Per le voci
# ancora aperte in cui il finanziamento si accumula, "to date": così la cifra resta
# corretta anche quando cresce.
#
# `project` è il progetto che contiene la voce. Si lascia vuoto quando coincide
# con l'acronimo, per non ripetere due volte lo stesso nome. `project_title` è il
# suo titolo ufficiale, che non sempre è lo scioglimento dell'acronimo: SYNERGIA e
# DEMETRA sono nomi propri affiancati a un titolo descrittivo.

- id: quantas
  scope: "Activity 2.4, work package 2 &ldquo;AGRI BIO&rdquo;"
  project: "SYNERGIA"
  project_title: "Sistemi e Sensori per l'Agroalimentare Resiliente ed Energeticamente Sostenibile"
  status: current
  acronym: AES-PLANT
  title: Autonomous embedded system for offline inference of plant nutritional status from VIS/NIR spectroscopy
  programme: MUR, Programma Nazionale Ricerca e Innovazione (PN RIC) 2021&ndash;2027 &mdash; D.D. 307/2025
  period: 2026 &ndash; 2028
  role: Scientific lead of the activity
  funding: "&euro;55,000 for the activity"
  description: >-
    A self-contained, wearable instrument that reads the nutritional state of a plant
    in the field, with no network connection. A modified RGB camera with optical
    filters feeds an edge processor built on microcontrollers with convolutional
    accelerators; leaf images are turned into synthetic spectra, and compact neural
    models — quantized and pruned to fit the device — produce the estimate on the
    spot, delivered through open-source smart glasses as a real-time overlay. The
    targets are an accuracy above 85%, inference under one second and eight hours of
    battery life.
  partners: CNR-IMM (work package leader), SmartMe.IO, Federico II of Naples, Bari, Catania, Palermo, Pavia, Scuola Normale Superiore.

- id: cyber21-2025
  scope: "Research line 2.15"
  project: ""
  project_title: ""
  status: current
  acronym: CYBER 2.1 (2025&ndash;2027)
  title: Decentralized, trustless and post-quantum infrastructure for data collection and analysis in Federated Smart Grids
  programme: National Electrical System Research &mdash; Three-Year Implementation Plan 2025&ndash;2027, MASE&ndash;CNR Programme Agreement
  period: 2026 &ndash; 2027
  role: Scientific lead for the University of Messina
  funding: "&euro;148,200 for the research line"
  description: >-
    Smart grids are becoming federations of independent operators, none of whom has
    reason to trust the others with the data that keeps the system running. The work
    builds the infrastructure that makes such data collection and analysis possible
    without a central authority to arbitrate it, and does so with cryptography chosen
    to survive quantum attack.
  partners: CNR Institute for Advanced Energy Technologies "Nicola Giordano".

