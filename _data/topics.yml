# Il vocabolario dei temi di ricerca, scritto una volta sola.
#
# `key` è quello che compare in `topics:` dentro people.yml.
# `label` è come il tema si legge sul sito, in inglese anche sulle pagine
# italiane: sono i termini con cui poi si cercano i paper.
# `areas` sono le chiavi di _data/areas.yml. Più d'una quando il tema sta
# davvero a cavallo.
#
# DA DOVE VENGONO. Li hanno scritti i dottorandi e i tesisti, non sono dedotti
# dalle loro biografie, e le etichette sono le loro parole esatte.
#
# L'AREA invece l'ha assegnata Claude leggendo il tema, perché loro hanno
# mandato le sole parole chiave: è la parte da ricontrollare.
#
# COSA SI DERIVA DA QUI. La riga di parole chiave sotto ogni foto nella pagina
# Team, le aree di ciascuna persona, l'elenco dei temi di ogni area sulla
# pagina delle tesi e le facce sotto ciascuna area. Nessuno di questi è scritto
# a mano da nessuna parte.
#
# Un tema senza nessuno compare lo stesso sulla pagina delle tesi, senza facce
# sotto: è il modo di annunciare un filone per cui si cerca un tesista.

