# Le quattro aree di ricerca del laboratorio, che sono le quattro righe
# dell'acronimo: Secure, TRustless, Autonomous, Ubiquitous Systems.
#
# `key` è quello che compare in `areas:` dentro topics.yml e projects.yml.
# `label` è il nome dell'area, che resta in inglese anche sulla pagina italiana:
# sono le lettere dell'acronimo, e tradurle lo scioglierebbe. Qui «Trustless» ha
# la sola T maiuscola; la doppia maiuscola di «TRustless» vale solo dove si sta
# sciogliendo il nome del laboratorio.
# `icon` è il nome dell'icona in _data/icons.yml.
# `tag` è la forma corta sulle card dei progetti.
#
# OGNI AREA PORTA DUE DESCRIZIONI, perché i due lettori sono diversi.
# `tagline_*` e `description_*` parlano allo studente che cerca una tesi: dicono
# in concreto cosa si fa, e stanno in italiano e in inglese perché la pagina
# «Fare la tesi in STRATUS Lab» esiste in due lingue.
# `research_en` parla a chi legge la pagina Research: stesso contenuto, registro
# scientifico. Solo in inglese, perché quella pagina esiste solo in inglese.
#
# I temi di ciascuna area non stanno qui: stanno in _data/topics.yml, che dice a
# quale area ciascun tema appartiene.

- key: secure
  label: Secure
  icon: shield-alt
  tagline_en: Making intelligent and cyber-physical systems safer, more resilient, and verifiable.
  tagline_it: Rendere i sistemi intelligenti e ciberfisici più sicuri, più resilienti e verificabili.
  description_en: >-
    Thesis activities may involve identifying vulnerabilities, developing security
    mechanisms, and experimentally evaluating their effectiveness in connected and
    cyber-physical systems. Students can also explore advanced cryptographic
    techniques and methods for assessing the security and robustness of artificial
    intelligence.
  description_it: >-
    Le attività di tesi possono riguardare l'individuazione di vulnerabilità, lo
    sviluppo di meccanismi di sicurezza e la valutazione sperimentale della loro
    efficacia nei sistemi connessi e ciberfisici. Si possono anche esplorare tecniche
    crittografiche avanzate e metodi per valutare la sicurezza e la robustezza
    dell'intelligenza artificiale.
  research_en: >-
    As software increasingly interacts with the physical world, cybersecurity must
    protect not only information but also the integrity and behavior of entire systems.
    We investigate security, resilience, and verification in cyber-physical and
    intelligent systems, combining advanced cryptography, formal methods, vulnerability
    analysis, and trustworthy artificial intelligence.
  tag: Secure

- key: trustless
  label: Trustless
  icon: key
  tagline_en: Building systems where trust is verified rather than assumed.
  tagline_it: Costruire sistemi in cui la fiducia si verifica invece di darla per scontata.
  description_en: >-
    Students may design and evaluate mechanisms for secure interactions between
    distributed components, exploring decentralized identity, access control, and
    verifiable execution. Activities can combine software prototyping, security
    analysis, and experimental evaluation of architectures that minimize implicit
    trust.
  description_it: >-
    Si possono progettare e valutare meccanismi per l'interazione sicura fra
    componenti distribuiti, esplorando identità decentralizzata, controllo degli
    accessi ed esecuzione verificabile. Le attività possono combinare prototipazione
    software, analisi di sicurezza e valutazione sperimentale di architetture che
    riducono al minimo la fiducia implicita.
  research_en: >-
    Building dependable distributed systems requires moving beyond implicit assumptions
    of trust. We investigate architectures and mechanisms that minimize trust
    dependencies through decentralized technologies, digital identity, Zero Trust
    principles, and secure and verifiable computation, enabling reliable interactions
    across heterogeneous and potentially untrusted environments.
  tag: Trustless

- key: autonomous
  label: Autonomous
  icon: cogs
  tagline_en: Enabling machines to perceive, learn, reason, and act in the physical world.
  tagline_it: Mettere le macchine in condizione di percepire, imparare, ragionare e agire nel mondo fisico.
  description_en: >-
    Thesis projects may involve developing, training, and evaluating intelligent
    algorithms through simulation and experimentation with robotic and automotive
    platforms. Students can explore reinforcement learning, embodied AI, LLMs, and
    world models, addressing practical challenges in perception, decision-making, and
    autonomous control.
  description_it: >-
    I progetti di tesi possono riguardare lo sviluppo, l'addestramento e la
    valutazione di algoritmi intelligenti, attraverso simulazione e sperimentazione su
    piattaforme robotiche e automotive. Si possono esplorare reinforcement learning,
    embodied AI, LLM e world model, affrontando problemi concreti di percezione,
    decisione e controllo autonomo.
  research_en: >-
    We investigate how intelligent machines can perceive their environment, learn from
    experience, reason, and make decisions with increasing autonomy. Our research spans
    autonomous driving, advanced robotics, reinforcement learning, and embodied
    intelligence, exploring emerging paradigms such as LLM-guided robotics and world
    models, with particular attention to real-world constraints.
  tag: Autonomous

- key: ubiquitous
  label: Ubiquitous
  icon: cloud
  tagline_en: Extending computation from embedded devices to distributed and cloud infrastructures.
  tagline_it: Estendere il calcolo dai dispositivi embedded alle infrastrutture distribuite e cloud.
  description_en: >-
    Students may design and experimentally evaluate embedded software, reconfigurable
    computing platforms, and mechanisms for sharing computational resources across
    distributed systems. Activities can address virtualization, hardware acceleration,
    and efficient resource management, from resource-constrained devices to cloud
    infrastructures.
  description_it: >-
    Si possono progettare e valutare sperimentalmente software embedded, piattaforme
    di calcolo riconfigurabile e meccanismi per condividere risorse di calcolo fra
    sistemi distribuiti. Le attività possono riguardare la virtualizzazione,
    l'accelerazione hardware e la gestione efficiente delle risorse, dai dispositivi
    con risorse limitate alle infrastrutture cloud.
  research_en: >-
    Computing is evolving into a pervasive continuum spanning embedded devices,
    intelligent edge systems, and cloud infrastructures. We investigate novel hardware and
    software architectures, reconfigurable computing, distributed virtualization, and
    resource orchestration to enable efficient, flexible, and interoperable computation
    across heterogeneous environments.
  tag: Ubiquitous
