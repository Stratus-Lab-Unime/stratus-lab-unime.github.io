- id: merlino
  name: Giovanni Merlino
  role: Associate Professor
  photo: /images/people/Merlino.png
  bio: >-
    Giovanni Merlino is Associate Professor of Computer Science Engineering at the
    Department of Engineering of the University of Messina. His research treats IoT
    and cyber-physical systems as software-defined infrastructure, with a focus on
    IT/OT convergence and on decentralization protocols. He conceived the I/Ocloud
    paradigm, contributed to the design of the Stack4Things middleware, and
    co-founded the academic spin-off SmartMe.IO.
  links:
    website: https://prosodiac.github.io
    scholar: https://scholar.google.com/citations?user=xHDCAI8AAAAJ
    github: https://github.com/gmerlino
    linkedin: https://www.linkedin.com/in/giovannimerlino
    scopus: https://www.scopus.com/authid/detail.uri?authorId=57193735363
    orcid: https://orcid.org/0000-0002-1469-7860
    email: giovanni.merlino@unime.it

- id: pispisa
  name: Gaetano Pio Pispisa
  role: PhD Student
  photo: /images/people/Pispisa.png
  photo_position: 75% top
  bio: >-
    Gaetano Pio Pispisa works on autonomous systems operating under hardware
    constraints. His research covers decentralized coordination in robot swarms and
    the techniques that make machine learning feasible within the limited memory and
    energy budget of an edge device.
  links:
    github: https://github.com/kartman88
    linkedin: https://it.linkedin.com/in/gaetano-pispisa-8a985623a
    orcid: https://orcid.org/0009-0006-2908-1475
    email: gaetanopio.pispisa@unime.it

