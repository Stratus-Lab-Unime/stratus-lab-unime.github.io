- id: fabiano
  name: Manuel Fabiano
  role: PhD Student
  photo: /images/people/Fabiano.png
  bio: >-
    Manuel Fabiano works on the security of industrial control systems, designed long
    before the threats they now face. His research applies post-quantum cryptography
    and decentralized identity to legacy industrial protocols, with energy
    infrastructure as its application domain.
  links:
    github: https://github.com/manuelFabiano
    orcid: https://orcid.org/0009-0001-5282-2036
    email: manuel.fabiano@unime.it

- id: lombardo
  name: Giovanni Lombardo
  role: PhD Student
  photo: /images/people/Lombardo.png
  bio: >-
    Giovanni Lombardo's research follows two lines. One concerns the security and
    virtualization of automotive and distributed systems, from intrusion detection on
    in-vehicle networks to hypervisors spanning distributed infrastructure. The other
    applies machine learning to hyperspectral sensing, for the non-invasive
    monitoring of crops.
  links:
    github: https://github.com/Lomby1902
    scopus: https://www.scopus.com/authid/detail.uri?authorId=60097846900
    orcid: https://orcid.org/0009-0003-0653-9349
    email: lombardo.giovanni@unime.it

