remote_theme: "mmistakes/so-simple-theme@3.2.0"
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate


locale: en-US
title: STRATUS Lab
description: Secure TRustless Autonomous Technologies for Ubiquitous Systems Laboratory
url: "https://stratus-lab-unime.github.io"
baseurl: ""
skin: "/assets/css/skins/default.css"

paginate: 5
paginate_path: /page:num/

author:
  name: "STRATUS Lab"
  bio: "Secure TRustless Autonomous Technologies for Ubiquitous Systems Laboratory"

copyright: >-
  &copy; 2026 STRATUS Lab, University of Messina.
  Powered by [Jekyll](https://jekyllrb.com) &amp; [So Simple](https://github.com/mmistakes/so-simple-theme).
  Built with [Claude Code](https://claude.com/claude-code).

# Footer
footer_links:
  - title: GitHub
    url: https://github.com/Stratus-Lab-Unime
    icon: github-square

# jQuery è servita dal repository invece che dal suo CDN, così il browser di chi
# visita il sito non contatta code.jquery.com, che altrimenti ne vedrebbe
# l'indirizzo IP. L'elenco sostituisce per intero quello predefinito del tema,
# quindi comprende anche main.min.js. Font Awesome non compare perché le sue icone
# sono disegnate in linea: vedi _data/icons.yml.
footer_scripts:
  - /assets/js/vendor/jquery-3.3.1.min.js
  - /assets/js/main.min.js

after_footer_scripts:
  - /assets/js/custom.js
